name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [buas/production]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install poetry
      - run: poetry install
      - run: poetry run ruff check .   # or flake8
